<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-label="Hermes mobile ticket frame">
  <defs>
    <linearGradient id="mDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090300"/>
      <stop offset=".62" stop-color="#140602"/>
      <stop offset="1" stop-color="#060100"/>
    </linearGradient>
    <pattern id="mHatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 0V9" stroke="#ff8a20" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="mGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 .45 0 0 .32  0 0 .1 0 .04  0 0 0 .6 0" result="warm"/>
      <feMerge>
        <feMergeNode in="warm"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="mTicket">
      <path d="M18 18H342V502H18Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#mTicket)">
    <rect width="360" height="520" fill="url(#mDark)"/>
    <rect width="360" height="520" fill="url(#mHatch)"/>
    <ellipse cx="292" cy="158" rx="160" ry="260" fill="#ff7a1a" opacity=".08"/>
    <path d="M44 154H316M44 354H316" stroke="#ff7a1a" stroke-opacity=".48" stroke-width="1.3"/>
    <path d="M44 386H316" stroke="#ff7a1a" stroke-opacity=".45" stroke-dasharray="3 5"/>
  </g>
  <path d="M18 18H342V502H18Z" fill="none" stroke="#ff7a1a" stroke-width="2" filter="url(#mGlow)"/>
  <path d="M32 34H328M32 486H328" stroke="#ffc06f" stroke-opacity=".34" stroke-width="1"/>
</svg>
